name: Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        type: choice
        options: [bitcoind, lnd, clightning, lampo]
      tag:
        description: Image tag (ex. 29.4.2, 0.21.3-beta-blake2b.17, 26.06.9-blake2b.7, 0.1.0-blake2b.1)
        required: true
      build_args:
        description: Build args, one KEY=VALUE per line (see docker/README.md)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]'

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ inputs.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/polar/${{ inputs.image }}:${{ inputs.tag }}
          push: true
