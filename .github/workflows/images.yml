name: Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        type: choice
        options: [bitcoind, lnd, clightning]
      tag:
        description: Image tag (ex. 29.4.2, 0.21.3-beta-blake2b.17, 26.06.8-blake2b.6)
        required: true
      build_args:
        description: Build args, one KEY=VALUE per line
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker/${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ inputs.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/polar/${{ inputs.image }}:${{ inputs.tag }}
          push: true
